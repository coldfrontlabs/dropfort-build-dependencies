name: Tests

on:
  push:
    branches: [ '*.x' ]
  pull_request:
    branches: [ '*.x' ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install modules
        run: npm install
